<style>
  :root{

    }

      max-width: 800px;
    }

    }

    }

    }

      max-width: 1000px;
    }
    .navbar {
      max-width: 1000px;
    }
    .sheet {
      max-width: 1000px;
    }
    .cart-bar {
      max-width: 1000px;
    }
    .chat-input-bar {
      max-width: 1000px;
    }

  #screen{padding-bottom:88px;}

  .logo-badge-img{width:46px;height:46px;border-radius:14px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.55);}

  .navbar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:430px;background:rgba(255,255,255,.65);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-top:1px solid var(--glassBorder);display:flex;justify-content:space-around;align-items:center;padding:8px 4px;z-index:20;}
  .navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;padding:4px 6px;cursor:pointer;flex-shrink:0;}
  .navbtn .icon{font-size:19px;}
  .navbtn.active{color:var(--teal);font-weight:600;}
  .footnote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .avatar-sm{width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0;}
  .avatar-lg{width:84px;height:84px;border-radius:16px;object-fit:cover;flex-shrink:0;}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .grid-item{background:var(--surface);border:1px solid var(--glassBorder);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);}
  .grid-icon{font-size:22px;}
  .grid-label{font-size:10.5px;color:var(--ink);text-align:center;line-height:1.3;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(10,30,28,.35);backdrop-filter:blur(2px);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:rgba(255,255,255,.85);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:14px 20px 24px;}
  .sheet-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 10px;}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(5,20,22,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lightbox-img{max-width:100%;max-height:100%;border-radius:16px;object-fit:contain;}
  .stats-band{background:linear-gradient(135deg,rgba(11,110,134,.92),rgba(14,147,172,.92));backdrop-filter:blur(10px);border-radius:18px;padding:22px 10px;display:grid;grid-template-columns:1fr 1fr;gap:18px 8px;}
  .stat-cell{text-align:center;}
  .stat-num{font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;color:#fff;margin:0;}
  .stat-tr{color:#E1F6FC;font-size:12px;margin:4px 0 0;}
  .stat-en{color:#B7DCEA;font-size:10px;margin:1px 0 0;}
  .footer-band{background:linear-gradient(135deg,rgba(11,110,134,.92),rgba(13,60,90,.92));backdrop-filter:blur(10px);border-radius:18px;padding:24px 20px;margin-top:8px;}
  .footer-tagline{color:#E1F6FC;font-size:13px;text-align:center;margin:0 0 16px;line-height:1.5;}
  .footer-links{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-bottom:14px;}
  .footer-link{background:none;border:none;color:#BCE0EC;font-size:12px;cursor:pointer;padding:2px 0;}
  .footer-phone{color:#fff;font-size:12px;text-align:center;margin:0;display:flex;align-items:center;justify-content:center;gap:6px;}
  .service-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .before-after{display:flex;gap:8px;margin-top:8px;}
  .before-after > div{flex:1;}
  .before-after img{width:100%;border-radius:10px;display:block;}
  .ba-label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;}
  .video-box{margin-top:10px;}
  .video-placeholder{background:rgba(11,110,134,.06);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;font-size:22px;color:var(--muted);}
  .video-placeholder span{font-size:11px;display:block;margin-top:6px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--glassBorder);background:rgba(255,255,255,.5);font-size:12px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .chip-active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .cam-wrap{position:relative;border-radius:16px;overflow:hidden;background:#0A2430;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;}
  .cam-wrap canvas{width:100%;height:100%;object-fit:cover;}
  .cam-status{position:absolute;color:#E1F6FC;font-size:13px;text-align:center;padding:0 20px;}
  .stars{color:#E0A526;font-size:13px;}
  .star-row{display:flex;gap:4px;}
  .star-btn{background:none;border:none;font-size:22px;color:var(--line);cursor:pointer;}
  .star-active{color:#E0A526;}
  .qty-row{display:flex;align-items:center;gap:10px;}
  .qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--glassBorder);background:rgba(255,255,255,.5);font-size:16px;color:var(--ink);cursor:pointer;}
  .qty-val{font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:14px;text-align:center;}
  .cart-bar{position:fixed;bottom:66px;left:0;right:0;max-width:430px;margin:0 auto;background:rgba(11,110,134,.92);backdrop-filter:blur(10px);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;z-index:15;}
  .chat-log{display:flex;flex-direction:column;gap:10px;}
  .chat-msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;}
  .chat-bot{background:var(--surface);border:1px solid var(--glassBorder);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-self:flex-start;border-bottom-left-radius:4px;}
  .chat-user{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .chat-input-bar{position:fixed;bottom:66px;left:0;right:0;max-width:430px;margin:0 auto;background:rgba(255,255,255,.7);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-top:1px solid var(--glassBorder);display:flex;gap:8px;padding:10px 14px;z-index:15;}
  .chat-input-bar .input{flex:1;}
/* Admin Panel Tabs */
.admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  padding: 12px;
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.admin-tab {
  flex: 1;
  min-width: 120px;
  padding: 12px 16px;
  border: 2px solid var(--border);
  background: var(--bg);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.admin-tab:hover {
  border-color: var(--teal);
  background: var(--hover);
}
.admin-tab.active {
  background: var(--teal);
  color: white;
  border-color: var(--teal);
}
.tab-badge {
  background: rgba(255,255,255,0.3);
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.admin-tab:not(.active) .tab-badge {
  background: var(--teal);
  color: white;
}

/* In-app notification toast */
.in-app-notif {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--teal);
  color: white;
  padding: 16px 20px;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  z-index: 9999;
  max-width: 320px;
  font-size: 14px;
  line-height: 1.5;
  transform: translateX(400px);
  transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.in-app-notif.show {
  transform: translateX(0);
}
.in-app-notif b {
  font-size: 15px;
  display: block;
  margin-bottom: 4px;
}

/* Splash Screen */
.splash-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000;
  transition: opacity 1s ease, transform 1s ease;
  overflow: hidden;
  cursor: pointer;
}
.splash-screen.hide {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}
.splash-skip-btn {
  position: absolute;
  bottom: 30px;
  right: 30px;
  padding: 12px 24px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 30px;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  z-index: 100000;
  transition: all 0.3s ease;
}
.splash-skip-btn:hover {
  background: rgba(255,255,255,0.3);
  transform: scale(1.05);
}
/* Slayt görselleri - tam ekran */
.splash-slide {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transform: scale(1.1);
  transition: opacity 0.8s ease-in-out;
}
.splash-slide.active {
  opacity: 1;
  animation: slideZoom 1.2s ease-out forwards;
}
@keyframes slideZoom {
  from { transform: scale(1.15); }
  to { transform: scale(1); }
}
.splash-slide.s1 { background-image: url('splash-1-space.jpg'); animation-delay: 0s; }
.splash-slide.s2 { background-image: url('splash-2-continents.jpg'); }
.splash-slide.s3 { background-image: url('splash-3-turkey.jpg'); }
.splash-slide.s4 { background-image: url('splash-4-mardin.jpg'); }
.splash-slide.s5 { background-image: url('splash-5-toki.jpg'); }
.splash-slide.s6 { background-image: url('splash-6-clinic.jpg'); }
.splash-slide.s7 { background-image: url('splash-7-door.jpg'); }
/* Koyu overlay */
.splash-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.4) 100%);
  z-index: 1;
}
/* Sahne etiketi */
.splash-scene-label {
  position: absolute;
  bottom: 60px;
  left: 0; right: 0;
  text-align: center;
  color: rgba(255,255,255,0.8);
  font-size: 13px;
  font-weight: 500;
  z-index: 3;
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  transition: opacity 0.4s;
  letter-spacing: 0.5px;
}
.splash-logo {
  width: 90px; height: 90px;
  border-radius: 24px;
  object-fit: contain;
  background: rgba(255,255,255,0.15);
  padding: 12px;
  animation: splashFadeIn 0.8s ease-out 0.5s both;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  position: relative; z-index: 3;
  backdrop-filter: blur(8px);
}
@keyframes splashFadeIn {
  from { opacity: 0; transform: scale(0.6) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.splash-title {
  color: white; font-size: 24px; font-weight: 700;
  margin-top: 18px;
  text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  animation: splashFadeUp 0.8s ease-out 1s both;
  position: relative; z-index: 3;
  letter-spacing: 0.5px;
}
.splash-subtitle {
  color: rgba(255,255,255,0.9); font-size: 14px;
  margin-top: 8px;
  animation: splashFadeUp 0.8s ease-out 1.4s both;
  position: relative; z-index: 3;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}
@keyframes splashFadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.splash-loader {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px; height: 3px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px; overflow: hidden;
  z-index: 3;
}
.splash-loader-bar {
  height: 100%;
  background: linear-gradient(90deg, #4fc3f7, #fff, #4fc3f7);
  border-radius: 3px;
  width: 0%;
  transition: width 0.3s linear;
}
@keyframes splashBlink {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.td-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: rgba(255,255,255,0.4);
  border-radius: 14px;
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}
.td-download-btn {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: var(--tealLight);
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: none;
}

</style>
</head>
<body>

<!-- Splash Screen -->
<div class="splash-screen" id="splash-screen">
  <div class="splash-slide s1"></div>
  <div class="splash-slide s2"></div>
  <div class="splash-slide s3"></div>
  <div class="splash-slide s4"></div>
  <div class="splash-slide s5"></div>
  <div class="splash-slide s6"></div>
  <div class="splash-slide s7"></div>
  <div class="splash-overlay"></div>

  <img src="icon-192.png" class="splash-logo" alt="Dinç Diş" />
  <p class="splash-title">Dinç Diş Kliniği</p>
  <p class="splash-subtitle">Gülümsemenin adresi</p>
  <p class="splash-scene-label" id="splash-scene">🌍 Uzaydan geliyoruz...</p>
  <div class="splash-loader"><div class="splash-loader-bar" id="splash-bar"></div></div>
  <button class="splash-skip-btn" id="splash-skip">Geç →</button>
</div>
<script>
(function() {
  var splashClosed = false;
  var currentSlide = 0;
  var totalSlides = 7;
  var sceneLabels = [
    '🌍 Uzaydan geliyoruz...',
    '🌏 Kıtalar görünüyor...',
    '🇹🇷 Türkiye...',
    '🏛️ Adana...',
    '🏘️ Seyhan Tepebağ...',
    '🏥 Kliniğimiz...',
    '🚪 Hoş geldiniz!'
  ];

  function closeSplash() {
    if (splashClosed) return;
    splashClosed = true;
    var splash = document.getElementById('splash-screen');
    if (splash) { splash.classList.add('hide'); setTimeout(function() { splash.remove(); }, 1000); }
  }

  // "Geç" butonu
  var skipBtn = document.getElementById('splash-skip');
  if (skipBtn) {
    skipBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      closeSplash();
    });
  }

  // Slayt gösterisi - OTOMATIK BAŞLAR
  var slides = document.querySelectorAll('.splash-slide');
  var sceneLabel = document.getElementById('splash-scene');
  var bar = document.getElementById('splash-bar');
  if (slides[0]) slides[0].classList.add('active');
  if (bar) bar.style.width = (1/totalSlides*100) + '%';

  var slideInterval = setInterval(function() {
    if (splashClosed) { clearInterval(slideInterval); return; }
    if (currentSlide < totalSlides - 1) {
      slides[currentSlide].classList.remove('active');
      currentSlide++;
      slides[currentSlide].classList.add('active');
      if (sceneLabel) sceneLabel.textContent = sceneLabels[currentSlide];
      if (bar) bar.style.width = ((currentSlide+1)/totalSlides*100) + '%';
    }
  }, 1000);

  setTimeout(function() { clearInterval(slideInterval); closeSplash(); }, 7000);

  // Dokunma ile atla
  var splash = document.getElementById('splash-screen');
  if (splash) {
    splash.addEventListener('click', closeSplash);
    splash.addEventListener('touchstart', closeSplash);
  }

  // MÜZİK - OTOMATIK BAŞLAR (tarayıcı izin verirse)
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      var ctx = new AC();
      // Eğer suspended ise kullanıcı etkileşimi bekle
      if (ctx.state === 'suspended') {
        var resume = function() { ctx.resume(); startSplashMusic(ctx); document.removeEventListener('click', resume); document.removeEventListener('touchstart', resume); };
        document.addEventListener('click', resume);
        document.addEventListener('touchstart', resume);
      } else {
        startSplashMusic(ctx);
      }
    }
  } catch(e) {}

  function startSplashMusic(ctx) {
    if (ctx._started) return;
    ctx._started = true;
    var t = ctx.currentTime;
    // Güzel piyano benzeri melodi - C majör arpej + melodi
    var melody = [
      // Arpej giriş (yumuşak, akan)
      {f:523.25, s:0.0, d:0.6},  // C5
      {f:659.25, s:0.15, d:0.5}, // E5
      {f:783.99, s:0.3, d:0.5},  // G5
      {f:1046.5, s:0.5, d:0.8},  // C6
      // Melodi (duygusal, sıcak)
      {f:880.0, s:1.3, d:0.5},   // A5
      {f:783.99, s:1.7, d:0.4},  // G5
      {f:698.46, s:2.1, d:0.6},  // F5
      {f:659.25, s:2.6, d:0.5},  // E5
      // Orta bölüm (huzur)
      {f:587.33, s:3.2, d:0.5},  // D5
      {f:523.25, s:3.6, d:0.6},  // C5
      {f:587.33, s:4.1, d:0.4},  // D5
      {f:659.25, s:4.4, d:0.5},  // E5
      // Final (çözüm, yükseliş)
      {f:698.46, s:5.0, d:0.4},  // F5
      {f:783.99, s:5.3, d:0.5},  // G5
      {f:880.0, s:5.7, d:0.4},   // A5
      {f:1046.5, s:6.0, d:1.0},  // C6 (uzun final)
    ];
    melody.forEach(function(n) {
      // Ana ton (piyano benzeri - sine + hafif triangle karışımı)
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0, t + n.s);
      gain.gain.linearRampToValueAtTime(0.12, t + n.s + 0.03);
      gain.gain.setValueAtTime(0.10, t + n.s + n.d * 0.4);
      gain.gain.exponentialRampToValueAtTime(0.001, t + n.s + n.d);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t + n.s); osc.stop(t + n.s + n.d + 0.05);
      // Harmonik (oktav üstü, çok hafif)
      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.value = n.f * 2;
      gain2.gain.setValueAtTime(0, t + n.s);
      gain2.gain.linearRampToValueAtTime(0.02, t + n.s + 0.03);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + n.s + n.d * 0.7);
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.start(t + n.s); osc2.stop(t + n.s + n.d + 0.05);
    });
    // Pad (arka plan ambiyans - C majör akor)
    [261.63, 329.63, 392.00].forEach(function(freq) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.025, t + 1.5);
      gain.gain.setValueAtTime(0.025, t + 5.5);
      gain.gain.linearRampToValueAtTime(0, t + 7);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 7.1);
    });
    // Chime (parlak dokunuşlar)
    [{f:2093, s:0.5}, {f:1568, s:2.1}, {f:1760, s:4.4}, {f:2093, s:6.0}].forEach(function(c) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = c.f;
      gain.gain.setValueAtTime(0.05, t + c.s);
      gain.gain.exponentialRampToValueAtTime(0.001, t + c.s + 1.0);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t + c.s); osc.stop(t + c.s + 1.1);
    });
  }
})();
</script>

<div id="shell">
  <div id="update-bar" style="position:sticky;top:0;z-index:50;"></div>
  <div id="screen"></div>
  <div id="more-sheet"></div>
  <div id="lightbox"></div>
  <div class="navbar" id="navbar"></div>
</div>
<script type="module" src="firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
